<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buscador de Buses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{margin:0}
/* Layout: una columna centrada; buscador arriba, resultados como "tiquetes de abordaje" */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --fg:#0a251d; --muted:#626671; --line:#d9dfdc;
  --accent:#22ae7c; --accent-ink:#0a251d; --accent-soft:#dff7e8;
  --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#a3322a; --bad-soft:#f8e2df;
  --display:Anton,Impact,"Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#19201c; --fg:#e6ece8; --muted:#97a69e; --line:#2b3530;
  --accent:#4cc28a; --accent-ink:#0d1a13; --accent-soft:#1d3428;
  --warn:#f0b75e; --warn-soft:#3a2c14; --bad:#ef8a80; --bad-soft:#3d1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#19201c; --fg:#e6ece8; --muted:#97a69e; --line:#2b3530;
  --accent:#4cc28a; --accent-ink:#0d1a13; --accent-soft:#1d3428;
  --warn:#f0b75e; --warn-soft:#3a2c14; --bad:#ef8a80; --bad-soft:#3d1f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{font-size:.88rem;color:var(--muted)}
.status b{color:var(--fg)}
.badge-ex{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;background:var(--warn-soft);color:var(--warn);padding:3px 8px;border-radius:99px;font-weight:600}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:1.15rem;padding:14px 16px 14px 46px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.search input:focus{outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:4px 10px;border-radius:99px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-size:.85rem;color:var(--muted)}
.results{display:flex;flex-direction:column;gap:12px}
.ticket{display:grid;grid-template-columns:minmax(120px,32%) 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stub{background:var(--accent);color:var(--accent-ink);padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-right:2px dashed var(--bg);min-width:0}
.stub .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;opacity:.85}
.stub .bus{font-family:var(--display);font-weight:400;letter-spacing:.02em;font-size:1.55rem;line-height:1.05;overflow-wrap:anywhere}
.stub .hora{font-family:var(--display);font-size:1.1rem;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.body{padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:8px}
.name{font-weight:600;font-size:1.1rem;overflow-wrap:anywhere}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 16px;font-size:.88rem}
.meta div{min-width:0;overflow-wrap:anywhere}
.meta span{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--fg)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.obs{font-size:.86rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:12px}
@media (max-width:520px){.ticket{grid-template-columns:1fr}.stub{border-right:0;border-bottom:2px dashed var(--bg)}}
@media (prefers-reduced-motion:no-preference){.ticket{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>¿En qué bus va?</h1>
    <p class="sub">Asamblea Rural · 24 de octubre. Escribe un nombre o número de documento; busca en todas las hojas a la vez.</p>
  </header>

  <div class="bar">
    <span class="status" id="status">Cargando la base de confirmados…</span>
  </div>

  <div class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Nombre o documento…" autocomplete="off" aria-label="Buscar persona">
  </div>

  <div class="chips" id="chips" aria-label="Filtrar por hoja"></div>
  <div class="count" id="count"></div>
  <div class="results" id="results"></div>
</div>

<script>
// Ruta del archivo dentro del repositorio (carpeta Bases)
const BASE = "Bases/Confirmados Asamblea Rural 24 Oct";
const EXTENSIONES = [".xlsx", ".xls", ".csv"];
const EJEMPLO = [];

let filas = EJEMPLO, hojas = [...new Set(EJEMPLO.map(r=>r.hoja))], hojaSel = null;
const $ = id => document.getElementById(id);
const norm = s => String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function buscarCol(row, ...claves){
  for (const k of Object.keys(row)) { const nk = norm(k); if (claves.some(c=>nk.includes(c))) return row[k]; }
  return "";
}
function busDe(r){ const b = buscarCol(r,"bus"); return b ? String(b) : r.hoja; }

function leerHoja(ws, nombre){
  const aoa = XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
  let h = aoa.findIndex(f => f.some(c=>norm(c)==="nombre") || f.some(c=>norm(c).startsWith("documento")));
  if (h < 0) return [];
  const enc = aoa[h].map(c=>String(c).trim());
  const out = [];
  for (const f of aoa.slice(h+1)) {
    const o = {hoja:nombre};
    enc.forEach((c,i)=>{ if (c) o[c] = String(f[i]??"").trim(); });
    if (buscarCol(o,"nombre") || buscarCol(o,"documento")) out.push(o);
  }
  return out;
}

function cargarLibro(buf, nombreArchivo){
  const f = {name:nombreArchivo};
    try {
      const wb = XLSX.read(buf,{type:"array"});
      filas = []; hojas = [];
      wb.SheetNames.forEach(n => { const r = leerHoja(wb.Sheets[n], n); if (r.length){ filas.push(...r); hojas.push(n);} });
      hojaSel = null;
      if (!filas.length) { $("status").innerHTML = `No encontré personas en <b>${esc(f.name)}</b>. Revisa que cada hoja tenga una fila de encabezados con "Nombre" o "Documento".`; }
      else $("status").innerHTML = `<b>${esc(f.name)}</b> · ${filas.length} personas en ${hojas.length} hojas`;
      pintarChips(); render();
          } catch(err) { $("status").textContent = "No pude leer el archivo. Verifica que el archivo de la carpeta Bases sea un Excel (.xlsx o .xls) válido."; }
}

async function cargarBase(){
  for (const ext of EXTENSIONES) {
    try {
      const r = await fetch(encodeURI(BASE + ext), {cache:"no-cache"});
      if (r.ok) { cargarLibro(await r.arrayBuffer(), BASE.split("/").pop() + ext); return; }
    } catch(e) {}
  }
  $("status").innerHTML = `No encontré <b>${esc(BASE)}.xlsx</b> en el sitio. Revisa que esté en la carpeta Bases con ese nombre exacto.`;
  render();
}

function pintarChips(){
  const todas = [null, ...hojas];
  $("chips").innerHTML = todas.map(h => {
    const n = h ? filas.filter(r=>r.hoja===h).length : filas.length;
    return `<button class="chip" aria-pressed="${h===hojaSel}" data-h="${h===null?"":esc(h)}">${h?esc(h):"Todas"} · ${n}</button>`;
  }).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { hojaSel = b.dataset.h || null; pintarChips(); render(); });
}

function resaltar(txt, q){
  const t = String(txt??""); if (!q) return esc(t);
  const nt = norm(t); const i = nt.indexOf(q);
  if (i < 0) return esc(t);
  return esc(t.slice(0,i)) + "<mark>" + esc(t.slice(i,i+q.length)) + "</mark>" + esc(t.slice(i+q.length));
}

function tag(texto, val, tipo){ return val ? `<span class="tag ${tipo||""}">${esc(texto)}</span>` : ""; }
const si = v => /^s[ií]|^x$|^true$/i.test(String(v).trim());
const no = v => /^no$/i.test(String(v).trim());

function render(){
  const q = norm($("q").value);
  const qDig = q.replace(/\D/g,"");
  let lista = filas.filter(r => !hojaSel || r.hoja===hojaSel);
  if (q) {
    const partes = q.split(/\s+/);
    lista = lista.filter(r => {
      const nom = norm(buscarCol(r,"nombre"));
      const doc = String(buscarCol(r,"documento")).replace(/\D/g,"");
      return partes.every(p=>nom.includes(p)) || (qDig.length>=3 && doc.includes(qDig));
    });
  }
  const total = lista.length;
  lista = lista.slice(0,60);
  $("count").textContent = q ? (total===1?"1 resultado":`${total} resultados`) + (total>60?" · mostrando los primeros 60":"") : `${total} personas · escribe para buscar`;
  if (!filas.length) { $("count").textContent = ""; $("results").innerHTML = `<div class="empty">Cuando cargue la base vas a poder buscar aquí.</div>`; return; }
  if (!total) { $("results").innerHTML = `<div class="empty">No hay nadie con "${esc($("q").value)}". Prueba con un solo apellido o con el número de documento sin puntos.</div>`; return; }
  $("results").innerHTML = lista.map(r => {
    const menor = buscarCol(r,"menor"), aut = buscarCol(r,"autoriz"), cuenta = buscarCol(r,"por su cuenta"), res = buscarCol(r,"resultado");
    const acud = buscarCol(r,"acudiente"), preg = buscarCol(r,"que preguntar"), obs = buscarCol(r,"observ");
    const tags = [
      si(menor) ? tag("Menor de edad", 1, "warn") : "",
      si(menor) ? (si(aut) ? tag("Autorización cargada",1) : tag("Sin autorización",1,"bad")) : "",
      si(cuenta) ? tag("Va por su cuenta",1,"warn") : "",
      res ? tag(res,1, /pend|no /i.test(res)?"warn":"") : ""
    ].join("");
    const hora = buscarCol(r,"hora");
    return `<article class="ticket">
      <div class="stub"><span class="lbl">Bus</span><span class="bus">${esc(busDe(r))}</span>${hora?`<span class="hora">${esc(hora)}</span>`:""}</div>
      <div class="body">
        <div class="name">${resaltar(buscarCol(r,"nombre"), q)}</div>
        <div class="meta">
          <div><span>Punto</span>${esc(buscarCol(r,"punto")||"—")}</div>
          <div><span>Documento</span>${esc(buscarCol(r,"documento")||"—")}</div>
          <div><span>Celular</span>${esc(buscarCol(r,"celular")||"—")}</div>
          ${acud?`<div><span>Celular acudiente</span>${esc(acud)}</div>`:""}
          ${buscarCol(r,"n.")?`<div><span>N.° en la hoja</span>${esc(buscarCol(r,"n."))}</div>`:""}
        </div>
        ${tags?`<div class="tags">${tags}</div>`:""}
        ${obs?`<div class="obs"><b>Observaciones:</b> ${esc(obs)}</div>`:""}
      </div></article>`;
  }).join("");
}

$("q").addEventListener("input", render);
pintarChips(); cargarBase();
</script>

</body>
</html>
